[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "glassesdata-pipeline"
version = "0.1.0"
description = "Offline pipeline for first-person Ray-Ban Meta recordings: hands, arms, head trajectory and objects in a gravity-aligned world, MuJoCo scenes and RL (see Docs/PIPELINE.md)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "av>=12",
    "mediapipe>=0.10.14",
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# The heavy set (Linux + CUDA machine only): the same pins as requirements.txt (keep them in sync);
# install torch from the CUDA index first (requirements.txt, scripts/setup_ubuntu.sh).
heavy = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.45",
    "open3d>=0.19",
    "trimesh>=4.4",
    "coacd>=1.0",
    "mujoco>=3.10,<5",
    "mujoco-warp==4.0.1",
    "warp-lang==1.19.0",
    "mink==1.4.0",
    "rsl-rl-lib==6.0.0",
    "rerun-sdk==0.43.2",
]

[project.scripts]
glassesdata-pipeline = "glassesdata_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["glassesdata_pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode: test files in tests/ and tests/core/ may share base names.
addopts = "--import-mode=importlib"
