# Step "retarget": hands_world.npz -> derived/retarget_<robot>.npz (floating robot hands, mink
# differential IK per frame; PIPELINE.md section 5). Needs mujoco + mink (Linux machine) and a clone of
# the MuJoCo Menagerie in the repository's gitignored local/src (scripts/setup_ubuntu.sh clones it):
# git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie local/src/mujoco_menagerie
[retarget]
robot = "shadow"                       # robot table in glassesdata_pipeline/sim/robots.py
# Menagerie clone, relative to the repository root. "" = $MUJOCO_MENAGERIE, else
# local/src/mujoco_menagerie ($GLASSESDATA_SRC replaces local/src); a path set here that does not
# exist falls back to $MUJOCO_MENAGERIE.
menagerie_path = ""
hands = "auto"                         # "auto" (hands valid in >= min_valid_fraction of frames), or e.g. ["right"]
min_valid_fraction = 0.2
base_body = "palm"                     # free joint on the palm (forearm + wrist joints dropped) or "forearm"
scaling = "wrist"                      # per-finger length scaling: "wrist" (relative to the wrist), "base", "none"
scale_limits = [0.5, 2.0]              # clamp of the per-finger scale factors
palm_position_cost = 1.0               # mink FrameTask costs
palm_orientation_cost = 0.5
tip_cost = 1.0                         # fingertips (position only)
middle_cost = 0.25                     # PIP/DIP (thumb MCP/IP) keypoints
base_cost = 0.1                        # MCP (thumb CMC) keypoints
posture_cost = 0.01                    # towards the neutral pose (finger joints only)
temporal_cost = 0.05                   # towards the previous frame's solution (finger joints only)
lm_damping = 1e-3                      # Levenberg-Marquardt damping of the frame tasks
damping = 1e-6                         # solve_ik damping on every dof
solver = "daqp"                        # QP solver (qpsolvers backend; daqp is installed with mink)
dt = 0.02                              # mink integration step (only scales the velocity; any positive value)
max_iters = 30                         # IK iterations per frame (warm-started from the previous frame)
tol_m = 1e-5                           # stop when the mean keypoint error improves less than this
smooth_sigma_frames = 1.0              # Gaussian smoothing of the solved trajectory (0 = off)
